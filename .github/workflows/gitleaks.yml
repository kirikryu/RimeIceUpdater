# Full-history secret scan with gitleaks. This is the CI layer of the
# secret-leak defense; the other two layers are GitHub push protection
# (blocks known patterns at push time) and the optional local pre-commit
# hook (.pre-commit-config.yaml). The binary is pinned and invoked
# directly (not via gitleaks-action) so every run sweeps the whole
# history regardless of how the workflow was triggered.

name: Secrets

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install gitleaks
      run: |
        curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
          | tar -xz -C /usr/local/bin gitleaks
        gitleaks version

    - name: Scan full history
      run: gitleaks git --redact --verbose --report-path gitleaks-report.json .

    - name: Upload report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: gitleaks-report
        path: gitleaks-report.json
        if-no-files-found: ignore
