# Optional local layer of the secret-scanning defense (the CI job
# .github/workflows/gitleaks.yml and GitHub push protection are the
# remote layers). Uses the "system" hook variant so pre-commit runs the
# gitleaks binary from PATH - no Go toolchain needed. Activate once per
# clone:
#   brew install gitleaks pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        # Upstream v8.30.1 omits pass_filenames: false for this hook id
        # (the gitleaks / gitleaks-docker ids have it). Without the
        # override pre-commit appends changed filenames to `gitleaks
        # git ...`, which accepts at most one positional arg and errors
        # out. Drop this once upstream ships the fix.
        pass_filenames: false
